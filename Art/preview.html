<!doctype html><meta charset="utf-8">
<!--
  Engraving page for Mod/About/Preview.png, per STYLE_RIMWORLD.md.

  Rasterised with headless Chrome at 896x504, so the glyphs are composed at final size and never
  resampled. The background is Preview-source.png at full resolution, scaled here rather than
  beforehand: starting from an already-reduced Preview.png would resample the picture twice.

    chrome --headless --disable-gpu --screenshot=Mod/About/Preview.png \
           --window-size=896,504 --hide-scrollbars Art/preview.html

  The source is already 16:9 (1672x941), so it scales without a crop.

  No count is engraved, deliberately: a compatibility mod counts the state of other mods rather
  than its own, so any number would expire without anyone touching this one. See the rule in
  STYLE_RIMWORLD.md and the Simple FX: Smoke Patches precedent.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:896px; height:504px; overflow:hidden; background:#000; }
  .stage { position:relative; width:896px; height:504px;
           font-family:"Segoe UI",system-ui,sans-serif; }

  /* No crop: the source is already 16:9 and its composition puts the beds just right of centre,
     which is where they belong. The title is kept inside the dark left third instead, on three
     short lines - pulling the background across to clear it moved the beds off their mark. */
  .shot { position:absolute; inset:0; width:896px; height:504px; object-fit:cover; }

  /* Repository standard: radial darkening from the top-left, nil at 74%. The scene's own fire
     pool sits low and right, so the title lands on the stone floor that was already darkest. */
  .veil { position:absolute; inset:0;
    background: radial-gradient(circle at 0% 0%, rgba(6,5,4,.86) 0%, rgba(6,5,4,0) 74%); }

  .text { position:absolute; left:56px; top:96px; width:430px; }
  h1 { font-size:42px; line-height:1.04; font-weight:700; color:#f2ece1;
       letter-spacing:-.5px; text-shadow:0 2px 10px rgba(0,0,0,.7); }
  .rule { width:58px; height:3px; background:#D68F2C; margin:22px 0 20px; }
  p { font-size:21px; line-height:1.42; color:#d8cfc0; text-shadow:0 1px 6px rgba(0,0,0,.75); }
</style>
<div class="stage">
  <img class="shot" src="Preview-source.png">
  <div class="veil"></div>
  <div class="text">
    <h1>Soft Warm<br>Primitive Beds<br>Renew</h1>
    <div class="rule"></div>
    <p>Bedding your colonists craft, haul and lay on a bed of hay.</p>
  </div>
</div>
